<main class="views">

    <div class="home">
      <header class="hh">
        <div class="hb"><img src="/logo-z.png" alt="" width="40" height="40"><div><b lang="en">ZodMotions</b><small>Motion · ZodClip · AI Stüdyo</small></div></div>

      <h1 id="hi">Bugün ne üretiyoruz?</h1>

      <div class="actions">
        <button class="act big" data-go="clip" type="button"><i>＋</i><b>Yeni video</b><span>Videolarını yükle, kes, yazı ve müzik ekle</span></button>
        <button class="act" data-go="clip" data-tab="klip" type="button"><i>✂</i><b>Klip çıkar</b><span>Uzun videodan en iyi anları bul</span></button>

      </div>

      <section class="blk" id="last" hidden>
        <div class="sh"><h2>Son proje</h2></div>
        <button class="lastp" data-go="clip" type="button"><span class="lt" id="last-t"></span><span class="btn sm">Devam et</span></button>

      <section class="blk">
        <div class="sh"><h2><span lang="en">Motion</span> klipleri</h2><span class="muted">Dokun, ZodClip’te videona eklensin</span></div>
        <div class="mots" id="mots"></div>
      </section>

      <section class="blk">
        <div class="sh"><h2>Şablon kategorileri</h2><button class="lnk" data-go="motion" type="button">Tümü</button></div>

      <p class="foot">Zodiac Web Design · <a href="mailto:info@zodiacwebdesign.com">info@zodiacwebdesign.com</a> · <span id="ver"></span></p>
    </div>
  </section>
  <section class="view" id="v-motion" aria-label="Motionlar"></section>
  <section class="view" id="v-clip" aria-label="ZodClip"></section>
  <section class="view" id="v-ai" aria-label="AI Stüdyo"></section>
  <section class="view" id="v-hesap" aria-label="Hesap"></section>
