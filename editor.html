<style>
.ed{max-width:1440px}
.ed-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;padding-block:28px 22px}
.crumb{font-family:var(--f-mono);font-size:12px;color:var(--mute);display:flex;gap:8px;flex-wrap:wrap}
.crumb a{color:var(--mute);text-decoration:none}.crumb a:hover{color:var(--fg)}
.ed-h h1{font-size:clamp(30px,4vw,52px);margin-top:10px}
.ed-h .nav2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stl{display:inline-flex;align-items:center;gap:10px;padding:0 14px 0 4px;margin-right:4px;border-right:1px solid var(--line2);min-height:36px}
.stl .sty button{width:24px;height:24px}
.app{display:grid;grid-template-columns:340px minmax(0,1fr) 300px;grid-template-areas:"side stage exp" "tl tl tl";gap:14px}
.box{background:var(--s1);border:1px solid var(--line);border-radius:16px;min-width:0}
.side{grid-area:side;display:grid;grid-template-rows:auto 1fr;overflow:hidden;max-height:760px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;padding:14px 4px 12px;cursor:pointer;color:var(--mute);font-weight:600;font-size:13px;display:grid;justify-items:center;gap:6px;border-bottom:2px solid transparent}
.tabs button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--acc-hi)}
.pnl{padding:20px;display:grid;gap:14px;align-content:start;overflow:auto}
.pnl h3{font-size:13px;font-family:var(--f-mono);font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.hint{font-size:13px;color:var(--dim)}
.colors{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.color{display:grid;gap:8px;padding:12px;border:1px solid var(--line2);border-radius:16px;background:var(--s2)}
.color input{width:100%;height:44px;border:0;padding:0;background:none;cursor:pointer;border-radius:12px}
.color span{font-size:13px;color:var(--mute)}.color code{font-family:var(--f-mono);font-size:12px}
.pal{display:flex;gap:8px;flex-wrap:wrap}
.pal button{display:flex;border:1px solid var(--line2);border-radius:12px;overflow:hidden;padding:0;cursor:pointer;background:none}
.pal i{width:22px;height:34px;display:block}
.up{display:flex;gap:14px;align-items:center;padding:16px;border:1px dashed var(--line2);border-radius:16px;cursor:pointer;background:var(--s2)}
.up:hover{border-color:var(--acc-hi)}
.up input{position:absolute;opacity:0;width:1px;height:1px}
.up i{width:40px;height:40px;border-radius:12px;background:var(--acc-soft);color:var(--acc-hi);display:grid;place-items:center;font-style:normal;flex:none}
.up span{display:grid;min-width:0}.up small{color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.up:focus-within{outline:2px solid var(--acc-hi);outline-offset:2px}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tgrid button{background:none;border:0;padding:0;cursor:pointer;display:grid;gap:6px;text-align:left;min-width:0}
.tgrid .fr{aspect-ratio:9/16;border-radius:12px;overflow:hidden;border:2px solid transparent;background:var(--s2);max-width:100%}
.tgrid .fr canvas{width:100%;height:100%}
.tgrid button[aria-pressed="true"] .fr{border-color:var(--acc-hi)}
.tgrid span{font-size:12px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stage-c{grid-area:stage;display:grid;justify-items:center;align-content:start;gap:14px;padding:22px;background:var(--s1) radial-gradient(circle at 50% 40%,rgba(94,107,255,.08),transparent 60%)}
.stage{width:min(100%,380px);aspect-ratio:9/16;border-radius:16px;overflow:hidden;background:#000;box-shadow:0 30px 80px rgba(0,0,0,.5);max-width:100%}
.stage canvas{width:100%;height:100%}
.trans{display:flex;align-items:center;gap:14px;width:min(100%,380px)}
.play{width:46px;height:46px;border-radius:50%;border:0;background:var(--fg);color:var(--bg);display:grid;place-items:center;cursor:pointer;flex:none}
.tcd{white-space:nowrap;font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--mute)}
.exp{grid-area:exp;padding:20px;display:grid;gap:14px;align-content:start}
.exp h2{font-family:var(--f-body);text-transform:none;font-size:17px;font-weight:700}
.bar{height:6px;border-radius:6px;background:var(--s3);overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--acc-hi);transition:width .2s}
.outv{border-radius:16px;overflow:hidden;background:#000;max-width:220px}
.outv video{width:100%}
.tlb{grid-area:tl;padding:16px 20px 20px}
.tl{position:relative;display:grid;gap:6px}
.tl .rul{display:grid;grid-template-columns:92px 1fr;gap:12px;height:18px}
.tl .ticks{position:relative}
.tl .ticks span{position:absolute;transform:translateX(-50%);font-family:var(--f-mono);font-size:12px;color:var(--dim)}
.tl .row{display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:center}
.tl .lab{font-family:var(--f-mono);font-size:12px;color:var(--mute);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tl .lane{position:relative;height:22px;border-radius:6px;background:var(--s2)}
.tl .lane i{position:absolute;top:3px;bottom:3px;border-radius:6px;background:var(--acc)}
.tl .lane i.bg{background:var(--s3)}
.tl .hit{position:absolute;left:104px;right:0;top:0;bottom:0;cursor:ew-resize;touch-action:none}
.tl .ph{position:absolute;top:0;bottom:0;width:2px;background:var(--rec);left:0;pointer-events:none}
.tl .ph::before{content:"";position:absolute;top:-2px;left:-5px;border:6px solid transparent;border-top-color:var(--rec)}
@media (max-width:1180px){.app{grid-template-columns:320px minmax(0,1fr);grid-template-areas:"side stage" "exp exp" "tl tl"}}
@media (max-width:760px){.trans .mono{display:none}.app{grid-template-columns:minmax(0,1fr);grid-template-areas:"stage" "side" "exp" "tl"}.side{max-height:none}.tl .rul,.tl .row{grid-template-columns:64px 1fr}.tl .hit{left:76px}}
</style></head>
<body data-page="editor">
<header id="zh" style="height:79px"></header>
<main class="wrap ed" lang="tr">
  <div class="ed-h">
    <div style="min-width:0"><div class="crumb"><a href="sablonlar.html">Şablonlar</a><span>/</span><a id="crSec" href="sablonlar.html">Sektör</a><span>/</span><span id="crCat">Tür</span></div><h1 id="tName">Editör</h1></div>
    <div class="nav2"><span class="stl"><span class="mono" style="color:var(--mute)">STİL</span><span class="sty" id="sty" role="group" aria-label="Stil seç"></span></span><button class="btn sm" id="prev" aria-label="Önceki şablon">← Önceki</button><button class="btn sm" id="next" aria-label="Sonraki şablon">Sonraki →</button><button class="btn sm" id="rnd">Rastgele şablon</button></div>
  </div>
  <div class="app">
    <section class="box side" aria-label="Düzenleme araçları">
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="metin" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M5 6h14M12 6v13M8 19h8"/></svg>Metin</button>
        <button role="tab" data-tab="renk" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></svg>Renk</button>
        <button role="tab" data-tab="medya" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M4 16l5-5 4 4 3-3 4 4"/></svg>Medya</button>
        <button role="tab" data-tab="sablon" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>Şablon</button>
      </div>
      <div class="pnl" id="pnl" role="tabpanel"></div>
    </section>
    <section class="box stage-c" aria-label="Önizleme">
      <div class="stage"><canvas id="stage" width="1080" height="1920" aria-label="Canlı önizleme"></canvas></div>
      <div class="trans"><button class="play" id="playBtn" aria-label="Duraklat"><svg width="16" height="16" viewBox="0 0 16 16" id="playIco"></svg></button><span class="tcd" id="tc">00:00:00 / 00:08:00</span><span class="mono" style="margin-left:auto;color:var(--dim)">9:16 · 1080 × 1920</span></div>
    </section>
    <section class="box exp" aria-label="Dışa aktar">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h2>Dışa aktar</h2><a class="link" href="hesap.html" id="acctLink" style="font-size:14px">Paketin: <b id="planName">Ücretsiz</b></a></div>
      <div class="kv">
        <div><span>Çözünürlük</span><b>1080 × 1920</b></div>
        <div><span>Süre</span><b id="kvDur">8 sn</b></div>
        <div><span>Damga</span><b id="kvWm">Yok</b></div>
        <div><span>Kalan hak</span><b id="quota">3 / 3</b></div>
      </div>
      <button class="btn pri" id="renderBtn">Videoyu oluştur</button>
      <div class="bar" aria-hidden="true"><i id="prog"></i></div>
      <p class="msg" id="msg" aria-live="polite"></p>
      <div class="outv" id="out" hidden><video id="outV" controls playsinline loop></video></div>
      <a class="btn" id="dl" hidden download="zodmotions.mp4" href="#">Videoyu indir</a>
      <p class="note">Pro düğmesi deneme içindir; ödeme yayında açılacak. <a class="link" href="fiyatlar.html">Paketler</a></p>
    </section>
    <section class="box tlb" aria-label="Zaman çizelgesi"><div class="tl" id="tl"></div></section>
  </div>
</main>
<footer id="zf"></footer>
<script src="zm-config.js"></script><script src="zm-auth.js"></script><script src="zm-engine.js"></script>
<script src="zm-site.js"></script>
<script>
(()=>{const Z=ZM,Ss=ZMS,$=Ss.$,T=Z.TEMPLATES,clamp=Z.clamp;
const q=Ss.get('q',{left:3,clean:1});
const want=decodeURIComponent(location.hash.slice(1))||Ss.sget('tpl');const first=T.find(t=>t.id===want)||T.find(t=>t.sector==='Restoran & Kafe')||T[0];
const S={tpl:first,f:{...first.def},A:{photo:null,logo:null},plan:'free',left:q.left,clean:q.clean,playing:!Ss.reduce,t:Ss.reduce?first.dur*.6:0,tab:'metin',userColors:null,psec:null};
const PALS=[['Gece mavisi','#1F3A5F','#F2A33A'],['Terrakota','#9A3412','#FDE68A'],['Orman','#1F3D33','#E8B04B'],['Antrasit','#1F2328','#38BDF8'],['Kum','#7A6A55','#FBF3E4'],['Mürdüm','#3B1D3F','#FF8FA3'],['Gece','#0E1430','#7C87FF']];
const esc=Ss.esc;
function panel(){const p=$('pnl');p.innerHTML='';
  if(S.tab==='metin'){p.insertAdjacentHTML('beforeend','<h3>Metinler</h3>');Object.entries(S.tpl.labels).forEach(([k,lab])=>{const id='f_'+k;const max=(S.tpl.max&&S.tpl.max[k])||(k==='title'?48:40);
    const d=document.createElement('div');d.className='fld';d.innerHTML=`<label for="${id}">${esc(lab)}</label>`;const inp=max>60?document.createElement('textarea'):document.createElement('input');if(inp.tagName==='INPUT')inp.type='text';else inp.rows=3;inp.id=id;inp.maxLength=max;inp.value=S.f[k]||'';
    inp.oninput=()=>{S.f[k]=inp.value;if(!S.playing)drawStage()};d.appendChild(inp);p.appendChild(d)});p.insertAdjacentHTML('beforeend','<p class="hint">Örnek metinleri kendi bilgilerinle değiştir. Değişiklikler önizlemede anında görünür.</p>')}
  if(S.tab==='renk'){p.insertAdjacentHTML('beforeend',`<h3>Marka renkleri</h3><div class="colors"><label class="color"><input type="color" id="cP" value="${S.f.p}"><span>Ana renk</span><code id="cPv">${S.f.p.toUpperCase()}</code></label><label class="color"><input type="color" id="cA" value="${S.f.a}"><span>Vurgu rengi</span><code id="cAv">${S.f.a.toUpperCase()}</code></label></div><h3>Hazır paletler</h3><div class="pal" id="pal"></div><button class="btn sm" id="resetC">Şablonun kendi renkleri</button><p class="hint">Seçtiğin renkler şablon değiştirsen de korunur.</p>`);
    const set=()=>{S.userColors={p:S.f.p,a:S.f.a};$('cPv').textContent=S.f.p.toUpperCase();$('cAv').textContent=S.f.a.toUpperCase();if(!S.playing)drawStage()};
    $('cP').oninput=e=>{S.f.p=e.target.value;set()};$('cA').oninput=e=>{S.f.a=e.target.value;set()};
    $('resetC').onclick=()=>{S.userColors=null;S.f.p=S.tpl.def.p;S.f.a=S.tpl.def.a;panel();drawStage()};
    PALS.forEach(([n,a,b])=>{const btn=document.createElement('button');btn.title=n;btn.setAttribute('aria-label',n+' paleti');btn.innerHTML=`<i style="background:${a}"></i><i style="background:${b}"></i>`;btn.onclick=()=>{S.f.p=a;S.f.a=b;$('cP').value=a;$('cA').value=b;set()};$('pal').appendChild(btn)})}
  if(S.tab==='medya'){p.insertAdjacentHTML('beforeend',`<h3>Görseller</h3><label class="up"><input type="file" id="upP" accept="image/*,video/*"><i>↑</i><span><b>Fotoğraf veya video yükle</b><small id="pN">${esc(S.photoName||'JPG, PNG, MP4 veya MOV')}</small></span></label><label class="up"><input type="file" id="upL" accept="image/*"><i>◎</i><span><b>Logo yükle</b><small id="lN">${esc(S.logoName||'Şeffaf PNG önerilir')}</small></span></label><button class="btn sm" id="clr">Görselleri kaldır</button><p class="hint">Fotoğrafın ya da videon şablonun arka planı olur. Videolar sessiz eklenir. Dosyaların bilgisayarından çıkmaz.</p>`);
    $('upP').onchange=e=>{const f=e.target.files[0];if(!f)return;const set=(m,label)=>{stopVid();S.A.photo=m;S.photoName=label;$('pN').textContent=label;drawStage()};
      if(f.type.startsWith('video')){if(f.size>500*1048576){$('pN').textContent='Video 500 MB\'tan küçük olmalı.';return}$('pN').textContent='Video hazırlanıyor…';const v=document.createElement('video');v.muted=true;v.loop=true;v.playsInline=true;v.setAttribute('playsinline','');v.preload='auto';
        v.onloadeddata=()=>{const pr=v.play();if(pr&&pr.catch)pr.catch(()=>{});set(v,'Video: '+f.name)};v.onerror=()=>{$('pN').textContent='Bu video açılamadı. MP4 (H.264) dene.'};v.src=URL.createObjectURL(f)}
      else loadImg(f,im=>set(im,f.name))};
    $('upL').onchange=e=>{const f=e.target.files[0];loadImg(f,im=>{S.A.logo=im;S.logoName=f.name;$('lN').textContent=f.name;drawStage()})};
    $('clr').onclick=()=>{stopVid();S.A={photo:null,logo:null};S.photoName=S.logoName=null;panel();drawStage()}}
  if(S.tab==='sablon'){const sec=S.psec||Z.secOf(S.tpl);const opts=[...Z.SECTORS.map(s=>s.n),'Genel'];
    p.insertAdjacentHTML('beforeend',`<h3>Şablon seç</h3><div class="fld"><label for="pSec">Sektör</label><select id="pSec">${opts.map(o=>`<option${o===sec?' selected':''}>${esc(o)}</option>`).join('')}</select></div><div class="tgrid" id="tg"></div>`);
    $('pSec').onchange=e=>{S.psec=e.target.value;panel()};
    const g=$('tg');Ss.GROUPS.filter(G=>Z.secOf(G[0])===sec).map(G=>G.includes(S.tpl)?S.tpl:G[0]).forEach(t=>{const b=document.createElement('button');b.setAttribute('aria-pressed',String(t===S.tpl));b.setAttribute('aria-label',t.cat+' şablonunu seç');
      b.innerHTML=`<div class="fr"><canvas width="135" height="240"></canvas></div><span>${esc(t.cat)}</span>`;g.appendChild(b);const th=Ss.thumb(b.querySelector('canvas'),t,{still:true});b.onmouseenter=()=>th.hover=true;b.onmouseleave=()=>th.hover=false;
      b.onclick=()=>{selectTpl(t);g.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}})}
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',String(x===b)));panel()});
function stopVid(){const v=S.A&&S.A.photo;if(v&&v.tagName==='VIDEO'){v.pause();try{URL.revokeObjectURL(v.src)}catch(e){}}}
function loadImg(file,cb){if(!file)return;if(file.size>15*1048576){$('msg').textContent='Görsel 15 MB\'tan küçük olmalı.';return}const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>cb(im);im.src=r.result};r.readAsDataURL(file)}
function styles(){const G=Ss.groupOf(S.tpl);const box=$('sty');box.parentElement.hidden=G.length<2;box.innerHTML=G.map((v,i)=>`<button type="button" aria-label="Stil ${i+1}" aria-pressed="${v===S.tpl}" style="--c1:${v.def.p};--c2:${v.def.a}"></button>`).join('');box.querySelectorAll('button').forEach((b,i)=>b.onclick=()=>selectTpl(G[i],true))}
function head(){styles();const sec=Z.secOf(S.tpl);$('crSec').textContent=sec;$('crSec').href='sablonlar.html'+(sec==='Genel'?'':'#'+Ss.slug(sec));$('crCat').textContent=S.tpl.cat;$('tName').textContent=S.tpl.cat+(S.tpl.sector?' · '+S.tpl.sector:'');document.title='ZodMotions Editör';
  try{history.replaceState(null,'','#'+S.tpl.id)}catch(e){}Ss.sset('tpl',S.tpl.id)}
function selectTpl(tpl,keep){const old=S.f;S.tpl=tpl;S.f={...tpl.def};if(keep)Object.keys(S.f).forEach(k=>{if(k!=='p'&&k!=='a'&&old[k]!=null)S.f[k]=old[k]});if(S.userColors){S.f.p=S.userColors.p;S.f.a=S.userColors.a}S.t=0;$('kvDur').textContent=tpl.dur+' sn';$('out').hidden=true;$('dl').hidden=true;$('prog').style.width='0';head();buildTL();if(S.tab!=='sablon')panel();drawStage()}
const step=d=>{const L=Ss.GROUPS.filter(G=>Z.secOf(G[0])===Z.secOf(S.tpl));const i=L.indexOf(Ss.groupOf(S.tpl));selectTpl(L[(i+d+L.length)%L.length][0]);if(S.tab==='sablon')panel()};
$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('rnd').onclick=()=>{selectTpl(T[Math.floor(Math.random()*T.length)]);if(S.tab==='sablon'){S.psec=null;panel()}};
function buildTL(){const tl=$('tl');const d=S.tpl.dur;let ticks='';for(let s=0;s<=d;s++)ticks+=`<span style="left:${s/d*100}%">${s}s</span>`;
  tl.innerHTML=`<div class="rul"><span class="mono" style="color:var(--dim)">KATMAN</span><div class="ticks">${ticks}</div></div>`+S.tpl.tracks.map(([n,a,b,isBg])=>`<div class="row"><span class="lab">${esc(n)}</span><div class="lane"><i class="${isBg?'bg':''}" style="left:${a/d*100}%;width:${Math.max(1,(Math.min(b,d)-a)/d*100)}%"></i></div></div>`).join('')+`<div class="hit" id="tlHit" aria-label="Zaman çizelgesinde konum seç"><div class="ph" id="ph"></div></div>`;
  const hit=$('tlHit');let drag=false;const seek=e=>{const r=hit.getBoundingClientRect();S.t=clamp((e.clientX-r.left)/r.width)*S.tpl.dur*.999;setPlay(false);drawStage()};
  hit.onpointerdown=e=>{drag=true;try{hit.setPointerCapture(e.pointerId)}catch(_){}seek(e)};hit.onpointermove=e=>{if(drag)seek(e)};hit.onpointerup=()=>drag=false}
const sctx=$('stage').getContext('2d');
const fmt=t=>{const fr=Math.floor(t*30);return `00:${String(Math.floor(fr/30)).padStart(2,'0')}:${String(fr%30).padStart(2,'0')}`};
function drawStage(){Z.renderFrame(sctx,S.tpl,S.t,S.f,S.A,S.plan==='free'&&S.clean<=0);$('tc').textContent=fmt(S.t)+' / '+fmt(S.tpl.dur);const ph=$('ph');if(ph)ph.style.left=(S.t/S.tpl.dur*100)+'%'}
function setPlay(v){S.playing=v;$('playBtn').setAttribute('aria-label',v?'Duraklat':'Oynat');$('playIco').innerHTML=v?'<rect x="3" y="2" width="3.5" height="12" rx="1" fill="currentColor"/><rect x="9.5" y="2" width="3.5" height="12" rx="1" fill="currentColor"/>':'<path d="M4 2.5v11l9-5.5z" fill="currentColor"/>'}
$('playBtn').onclick=()=>setPlay(!S.playing);
function fromAcct(u){if(u){const p=u.profile,P=ZMA.PLANS[p.plan]||ZMA.PLANS.free;S.plan=(p.plan==='free'||p.plan==='deneme')?'free':'pro';S.left=p.motion_left;S.clean=p.clean_left;$('planName').textContent=P.n}else{S.plan='free';S.left=3;S.clean=1;$('planName').textContent='Hesap yok'}S.acct=!!u;updQ();drawStage()}
ZMA.onChange(fromAcct);
function updQ(){$('kvWm').textContent=S.plan==='free'&&S.clean<=0?'Var':'Yok';$('msg').className='msg';
  if(!S.acct){$('quota').textContent='3 / 3';$('renderBtn').disabled=false;$('renderBtn').textContent='Ücretsiz hesap aç ve oluştur';$('msg').textContent='Videoyu indirmek için ücretsiz hesap aç. Kart gerekmez; ilk 3 motion videon ücretsiz.';return}
  $('renderBtn').textContent='Videoyu oluştur';
  if(S.plan==='pro'){$('quota').textContent=S.left===null?'Sınırsız':S.left+' kaldı';$('renderBtn').disabled=S.left!==null&&S.left<=0;$('msg').textContent=S.left!==null&&S.left<=0?'Bu ayki motion hakkın bitti. Bir üst pakete geçebilirsin.':'Paketinde videolar damgasız oluşur.'}
  else{$('quota').textContent=S.left+' / 3';$('renderBtn').disabled=S.left<=0;$('msg').textContent=S.left<=0?'Ücretsiz deneme hakkın bitti. Devam etmek için bir paket seç.':S.clean>0?'İlk videon damgasız. Sonraki iki ücretsiz video ZodMotions damgalı çıkar.':'Kalan ücretsiz videoların ZodMotions damgalı. Damgasız devam etmek için bir paket seç.'}}
let rendering=false;
$('renderBtn').onclick=async()=>{if(rendering)return;
  if(!ZMA.user()){ZMA.requireLogin('editor.html#'+S.tpl.id);return}
  if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream){$('msg').textContent='Bu tarayıcı videoyu burada oluşturamıyor. Chrome, Edge veya güncel Safari ile dene.';return}
  rendering=true;$('renderBtn').disabled=true;const use=await ZMA.useMotion();if(!use.ok){rendering=false;updQ();$('msg').className='msg err';$('msg').textContent=use.error;return}
  $('out').hidden=true;$('dl').hidden=true;$('msg').className='msg';$('msg').textContent='Video oluşturuluyor…';
  const cv=document.createElement('canvas');cv.width=1080;cv.height=1920;const cx=cv.getContext('2d');const tpl=S.tpl,f={...S.f},A={...S.A},wm=!!use.wm;Z.renderFrame(cx,tpl,0,f,A,wm);
  const types=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'];const mime=types.find(m=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m))||'';
  let rec;try{rec=new MediaRecorder(cv.captureStream(30),mime?{mimeType:mime,videoBitsPerSecond:8e6}:undefined)}catch(err){$('msg').textContent='Kayıt başlatılamadı: '+err.message;rendering=false;updQ();return}
  const ch=[];rec.ondataavailable=e=>{if(e.data.size)ch.push(e.data)};
  rec.onstop=()=>{const blob=new Blob(ch,{type:mime||'video/webm'});const url=URL.createObjectURL(blob);$('outV').src=url;const dl=$('dl');dl.href=url;dl.download=`zodmotions-${tpl.id}.${mime.includes('mp4')?'mp4':'webm'}`;dl.hidden=false;$('out').hidden=false;rendering=false;updQ();$('msg').className='msg ok';
    $('msg').textContent=`Hazır: ${(blob.size/1048576).toFixed(1)} MB · ${tpl.dur} sn ${mime.includes('mp4')?'MP4':'WebM'}. “Videoyu indir” ile kaydet.`;$('prog').style.width='100%'};
  if(A.photo&&A.photo.tagName==='VIDEO'){A.photo.currentTime=0;const pv=A.photo.play();if(pv&&pv.catch)pv.catch(()=>{})}rec.start(250);const t0=performance.now();const st=()=>{const t=(performance.now()-t0)/1000;if(t>=tpl.dur){Z.renderFrame(cx,tpl,tpl.dur,f,A,wm);rec.stop();return}Z.renderFrame(cx,tpl,t,f,A,wm);$('prog').style.width=(t/tpl.dur*100).toFixed(1)+'%';requestAnimationFrame(st)};requestAnimationFrame(st)};
Ss.onFrame(dt=>{if(S.playing){S.t=(S.t+dt)%S.tpl.dur;drawStage()}});
addEventListener('hashchange',()=>{const t=T.find(x=>x.id===location.hash.slice(1));if(t&&t!==S.tpl)selectTpl(t)});
Ss.ready(()=>{$('kvDur').textContent=S.tpl.dur+' sn';head();buildTL();panel();updQ();setPlay(S.playing);drawStage()});
})();
</script>
</body></html>
