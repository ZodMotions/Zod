<link rel="stylesheet" href="zm.css">
<style>
.story{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(28px,5vw,72px);align-items:start}
.story .t{display:grid;gap:18px;font-size:18px;color:var(--mute);max-width:60ch}
.story .t p:first-child{color:var(--fg);font-size:21px;line-height:1.5}
.who{display:flex;gap:16px;align-items:center}
.who .av{width:64px;height:64px;border-radius:16px;background:var(--acc);display:grid;place-items:center;font-family:var(--f-disp);font-weight:900;font-size:26px;color:#fff;flex:none;font-stretch:120%;font-variation-settings:"wdth" 120}
.facts{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.facts div{padding:22px;border-right:1px solid var(--line);display:grid;gap:4px}
.facts div:last-child{border-right:0}
.facts b{font-family:var(--f-disp);font-weight:800;font-size:clamp(34px,4vw,52px);line-height:1;font-variant-numeric:tabular-nums}
.facts span{font-family:var(--f-mono);font-size:12px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase}
.mk{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.mk .panel{display:grid;gap:10px;align-content:start}
.mk .panel p{color:var(--mute)}
.mk .mono{color:var(--acc-hi)}
.ct{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:14px;scroll-margin-top:100px}
.ct form{display:grid;gap:14px}
.legal{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;scroll-margin-top:100px}
.legal .panel{display:grid;gap:10px;align-content:start}
.legal ul{margin:0;padding-left:18px;color:var(--mute);display:grid;gap:6px;font-size:14.5px}
@media (max-width:900px){.story,.ct,.legal{grid-template-columns:1fr}.mk{grid-template-columns:1fr}}
@media (max-width:520px){.facts{grid-template-columns:1fr}.facts div{border-right:0;border-bottom:1px solid var(--line)}.facts div:last-child{border-bottom:0}}
#sss{scroll-margin-top:100px}
</style></head>
