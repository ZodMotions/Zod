<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Giriş yap / Kayıt ol · ZodMotions</title>
<meta name="description" content="ZodMotions hesabı oluştur: 3 motion video ücretsiz, kart gerekmez.">
<meta property="og:type" content="website"><meta property="og:site_name" content="ZodMotions"><meta property="og:title" content="Giriş yap / Kayıt ol · ZodMotions"><meta property="og:description" content="ZodMotions hesabı oluştur: 3 motion video ücretsiz, kart gerekmez."><meta property="og:image" content="og.jpg"><meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0E0F11"><link rel="icon" type="image/png" href="favicon.png"><link rel="apple-touch-icon" href="favicon.png">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,400..900&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Big+Shoulders+Display:wght@700;800;900&family=Unbounded:wght@500;700&family=Manrope:wght@500;600;700&family=JetBrains+Mono:wght@500&family=Playfair+Display:ital,wght@1,500&display=swap">
<link rel="stylesheet" href="zm.css">
</head>
<body data-page="giris">
<header id="zh" style="height:79px"></header>
<main class="wrap" lang="tr">
 <div class="auth">
  <div class="logo-b"><img src="logo-z.png" alt="" width="84" height="84"><h1 id="ttl">Hesap oluştur</h1><p class="lead" id="sub" style="text-align:center;color:var(--mute)">3 motion videon ücretsiz. Kart gerekmez.</p></div>
  <div class="seg" role="tablist" aria-label="Giriş veya kayıt"><button role="tab" id="tKayit" aria-selected="true">Kayıt ol</button><button role="tab" id="tGiris" aria-selected="false">Giriş yap</button></div>
  <button type="button" class="gbtn" id="gBtn"><svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg><span>Google ile devam et</span></button>
  <div class="or">veya e-postayla</div>
  <form id="fAuth" novalidate>
   <div class="fld" id="wAd"><label for="ad">Ad soyad</label><input id="ad" autocomplete="name" placeholder="Adın ve soyadın"></div>
   <div class="fld" id="wFirma"><label for="firma">Firma adı <span style="opacity:.6">(isteğe bağlı)</span></label><input id="firma" autocomplete="organization" placeholder="Reklamın üzerinde görünecek ad"></div>
   <div class="fld"><label for="email">E-posta</label><input id="email" type="email" autocomplete="email" inputmode="email" placeholder="ornek@firma.com"></div>
   <div class="fld"><label for="pw">Şifre</label><div class="pw"><input id="pw" type="password" autocomplete="new-password" placeholder="En az 8 karakter" minlength="8"><button type="button" id="pwT" aria-label="Şifreyi göster">Göster</button></div></div>
   <label class="chk" id="wKvkk"><input type="checkbox" id="kvkk"><span><a href="hakkimizda.html#yasal" target="_blank">Kullanım koşulları</a>nı ve <a href="hakkimizda.html#yasal" target="_blank">KVKK aydınlatma metni</a>ni okudum, kabul ediyorum.</span></label>
   <label class="chk" id="wIleti"><input type="checkbox" id="ileti"><span>Kampanya ve yeni şablon duyurularını e-postayla almak istiyorum. <span style="opacity:.6">(isteğe bağlı)</span></span></label>
   <button class="btn pri" id="go" type="submit">Hesabımı oluştur</button>
   <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </form>
  <p class="sm" id="forgotW" hidden><a href="#" id="forgot">Şifremi unuttum</a></p>
  <p class="note-prev" id="prevNote" hidden>Önizleme modu: hesaplar şimdilik sadece bu tarayıcıda saklanıyor. Gerçek hesap sistemi bağlandığında bu not kalkar.</p>
 </div>
</main>
<footer id="zf"></footer>
<script src="zm-config.js"></script><script src="zm-auth.js"></script><script src="zm-engine.js"></script>
<script src="zm-site.js"></script>
<script>
(()=>{const $=id=>document.getElementById(id);const q=new URLSearchParams(location.search);const next=q.get('next')||'hesap.html';
let mode=q.get('mode')==='giris'?'giris':'kayit';
if(ZMA.mode==='preview')$('prevNote').hidden=false;
ZMA.ready.then(()=>{if(ZMA.user())location.replace(next)});
function setMode(m){mode=m;const k=m==='kayit';$('tKayit').setAttribute('aria-selected',k);$('tGiris').setAttribute('aria-selected',!k);
 $('wAd').hidden=!k;$('wFirma').hidden=!k;$('wKvkk').hidden=!k;$('wIleti').hidden=!k;$('forgotW').hidden=k;
 $('ttl').textContent=k?'Hesap oluştur':'Tekrar hoş geldin';$('sub').textContent=k?'3 motion videon ücretsiz. Kart gerekmez.':'Hesabına giriş yap, kaldığın yerden devam et.';
 $('go').textContent=k?'Hesabımı oluştur':'Giriş yap';$('pw').autocomplete=k?'new-password':'current-password';$('msg').textContent='';$('msg').className='msg';
 history.replaceState(null,'','?mode='+m+(q.get('next')?'&next='+encodeURIComponent(next):''))}
$('tKayit').onclick=()=>setMode('kayit');$('tGiris').onclick=()=>setMode('giris');setMode(mode);
$('pwT').onclick=()=>{const p=$('pw');const s=p.type==='password';p.type=s?'text':'password';$('pwT').textContent=s?'Gizle':'Göster';$('pwT').setAttribute('aria-label',s?'Şifreyi gizle':'Şifreyi göster')};
const say=(t,ok)=>{$('msg').className='msg '+(ok?'ok':'err');$('msg').textContent=t};
$('fAuth').onsubmit=async e=>{e.preventDefault();const b=$('go');if(b.disabled)return;
 if(mode==='kayit'&&!$('kvkk').checked){say('Devam etmek için kullanım koşullarını ve KVKK metnini onayla.');return}
 b.disabled=true;const old=b.textContent;b.textContent='Bekle…';
 const a={email:$('email').value,password:$('pw').value,ad:$('ad').value,firma:$('firma').value,ileti:$('ileti').checked};
 const r=mode==='kayit'?await ZMA.signUp(a):await ZMA.signIn(a);b.disabled=false;b.textContent=old;
 if(!r.ok){say(r.error);return}
 if(r.confirm){say('Hesabın oluşturuldu. E-postana gelen doğrulama bağlantısına tıkla, sonra giriş yap.',true);return}
 say(mode==='kayit'?'Hesabın hazır, yönlendiriliyorsun…':'Giriş yapıldı, yönlendiriliyorsun…',true);setTimeout(()=>location.href=next,500)};
$('gBtn').onclick=async()=>{const r=await ZMA.google();if(!r.ok)say(r.error)};
$('forgot').onclick=async e=>{e.preventDefault();const r=await ZMA.resetPassword($('email').value);say(r.ok?r.note:r.error,r.ok)};
})();
</script>
</body></html>
